<!doctype html>
<html lang="es" data-theme="lyer" data-tema="oscuro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/iconCamion.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Sistema de gestión de taller Mecánica LYER" />
    <title>Sistema Lyer</title>
  </head>
  <body style="margin:0">
    <div id="app"></div>
    <script>
      (function () {
        var claro = localStorage.getItem('lyer.tema') === 'claro';
        document.documentElement.dataset.tema = claro ? 'claro' : 'oscuro';
        document.documentElement.dataset.theme = claro ? 'lyer-claro' : 'lyer';
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
