name: lyer-motors

services:
  postgres:
    image: postgres:16-alpine
    container_name: lyer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lyer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      POSTGRES_DB: ${DB_NAME:-lyer_motors}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lyer_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyer_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-lyer}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-lyer_motors}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      FRONTEND_URL: ${FRONTEND_URL:-${PUBLIC_URL:-http://localhost}}
      PORT: "3000"
      RUN_SEED: ${RUN_SEED:-if-empty}
      APISPERU_BASE_URL: ${APISPERU_BASE_URL:-https://dniruc.apisperu.com/api/v1}
      APISPERU_TOKEN: ${APISPERU_TOKEN:-}
      PYTHON: /opt/placas-venv/bin/python
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
    volumes:
      - uploads_data:/app/uploads
      - ./backend/ml/placas/modelos:/app/ml/placas/modelos:ro
    networks:
      - lyer_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/salud').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: lyer_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - lyer_net
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:

networks:
  lyer_net:
    driver: bridge
